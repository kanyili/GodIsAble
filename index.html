<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>大山為我挪開 - 太鼓達人</title>
    <style>
        body {
            background-color: #1a1a1a;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            margin: 0;
            padding: 0;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #game-wrapper {
            width: 1200px;
            height: 1100px;
            position: relative;
            transform-origin: center center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #game-container {
            width: 1200px;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #dashboard {
            margin-bottom: 10px;
            width: 1200px;
            height: 160px;
            background-color: #333;
            border: 3px solid #555;
            border-radius: 12px;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            box-sizing: border-box;
            margin-left: auto;
            margin-right: auto;
        }

        #score-display {
            width: 900px;
            margin: 0 auto 8px auto;
            text-align: center;
            font-size: 28px;
            font-weight: bold;
            color: #ffcc00;
        }

        #lyrics-box {
            width: 900px;
            height: auto;
            max-height: none;
            margin: 0 auto 8px auto;
            background-color: rgba(0, 0, 0, 0.4);
            border: 2px solid #444;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 28px;
            color: #ddd;
            text-align: center;
            padding: 12px 15px;
            box-sizing: border-box;
            line-height: 1.4;
            white-space: pre-wrap;
            overflow: visible;
        }

        #player-wrapper {
            position: relative;
            width: 900px;
            margin: 0 auto;
        }

        #player-container {
            width: 900px;
            height: 50px;
            margin: 0 auto;
            border: 3px solid #444;
            border-radius: 12px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            overflow: hidden;
            position: relative;
            background-color: #000;
        }

        #local-video, #youtube-player {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: cover;
        }

        #youtube-player {
            display: none;
        }

        #start-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 12px;
            z-index: 30;
        }

        #start-btn {
            padding: 15px 35px;
            font-size: 24px;
            font-weight: bold;
            background-color: #ffcc00;
            color: #1a1a1a;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(255, 204, 0, 0.4);
            transition: transform 0.1s;
        }

        #start-btn:hover:not(:disabled) {
            transform: scale(1.05);
            background-color: #ffdd33;
        }

        #start-btn:disabled {
            background-color: #666;
            color: #aaa;
            cursor: not-allowed;
            box-shadow: none;
        }

        #time-display {
            position: absolute;
            left: 25px;
            font-size: 24px;
            font-weight: bold;
            color: #aaa;
            z-index: 10;
            font-family: monospace;
        }

        #feedback {
            position: absolute;
            left: 140px;
            width: 110px;
            font-size: 22px;
            font-weight: bold;
            color: #ff4444;
            text-align: center;
            z-index: 10;
            pointer-events: none;
        }

        #judge-line {
            position: absolute;
            left: 270px;
            width: 110px;
            height: 110px;
            background-color: rgba(255, 255, 255, 0.1);
            border: 4px solid #eee;
            border-radius: 50%;
            z-index: 10;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 50px;
            color: #fff;
            box-shadow: 0 0 15px rgba(255,255,255,0.3);
            transition: transform 0.1s;
            user-select: none;
        }

        @keyframes flashEffectBottom {
            0% { transform: scale(1); border-color: #eee; background-color: rgba(255,255,255,0.1); }
            50% { transform: scale(1.15); border-color: #ffcc00; background-color: rgba(255,204,0,0.4); box-shadow: 0 0 25px #ffcc00; }
            100% { transform: scale(1); border-color: #eee; background-color: rgba(255,255,255,0.1); }
        }

        .flash {
            animation: flashEffectBottom 0.15s ease;
        }

        #game-canvas {
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 5;
        }
    </style>
</head>
<body>

    <div id="game-wrapper">
        <div id="game-container">
            <!-- 1. 儀錶板 -->
            <div id="dashboard">
                <div id="time-display">00:00:00</div>
                <div id="feedback"></div>
                <div id="judge-line">◎</div>
                <canvas id="game-canvas" width="1200" height="160"></canvas>
            </div>

            <!-- 2. 分數和正確率 -->
            <div id="score-display">0分 (正確率 0%)</div>

            <!-- 3. 歌詞 -->
            <div id="lyrics-box">[Verse]
雖然道路崎嶇 困難險阻
但我心中知道祢一直都在
不能明白為何擔此重擔
但我始終相信 祢一直牽著我

[Chorus]
大山為我移開 大海有路出來
我要大聲宣告 耶穌 祢一直都在
祢手上的釘痕 彰顯十架大愛
我要大聲宣告 耶穌 祢一直都在

[Bridge]
祢的話讓我明白 祢愛我永不更改
祢保守我的心懷 緊握祢雙手不放開</div>

            <!-- 4. mp3 播放框 -->
            <div id="player-wrapper">
                <div id="player-container">
                    <video id="local-video" src="Mountains_Move_for_Me.mp3" playsinline controls></video>
                    <div id="youtube-player"></div>
                </div>

                <div id="start-screen">
                    <button id="start-btn" disabled>載入中...</button>
                </div>
            </div>
        </div>
    </div>

    <script id="chart-data" type="application/json">
    [
        { "time": "00:05:70", "key": "Space", "type": "space" },
        { "time": "00:05:90", "key": "Space", "type": "space" },
        { "time": "00:06:80", "key": "ArrowLeft", "type": "left" },
        { "time": "00:07:80", "key": "ArrowRight", "type": "right" },
        { "time": "00:08:70", "key": "ArrowUp", "type": "up" },
        { "time": "00:09:70", "key": "ArrowDown", "type": "down" },
        { "time": "00:10:00", "key": "Space", "type": "space" }
    ]
    </script>

    <script src="https://www.youtube.com/iframe_api"></script>

    <script>
        function resizeGame() {
            const wrapper = document.getElementById('game-wrapper');
            const baseWidth = 1200;
            const baseHeight = 1100;

            const scaleX = window.innerWidth / baseWidth;
            const scaleY = window.innerHeight / baseHeight;
            const scale = Math.min(scaleX, scaleY);

            wrapper.style.transform = `scale(${scale})`;
        }

        window.addEventListener('resize', resizeGame);
        window.addEventListener('orientationchange', resizeGame);
        resizeGame();

        let ytPlayer = null;
        let ytApiReady = false;
        let useYouTube = false;

        const localVideo = document.getElementById('local-video');
        const startScreen = document.getElementById('start-screen');
        const startBtn = document.getElementById('start-btn');
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');
        const judgeLine = document.getElementById('judge-line');
        const scoreDisplay = document.getElementById('score-display');
        const timeDisplay = document.getElementById('time-display');
        const feedback = document.getElementById('feedback');
        
        const PREVIEW_TIME = 1.5; 
        const JUDGE_X = 325;      
        const SPAWN_X = 1150;     
        const HIT_WINDOW = 0.2;   

        let score = 0;
        const TOTAL_NOTES = 7;
        let gameStarted = false;
        let lastCurrentTime = 0;
        let feedbackTimer = null;
        let playerInputsLog = []; // 儲存玩家按鍵紀錄

        function showFeedback(text) {
            feedback.textContent = text;
            if (feedbackTimer) {
                clearTimeout(feedbackTimer);
            }
            feedbackTimer = setTimeout(() => {
                feedback.textContent = "";
            }, 1000);
        }

        function updateScoreDisplay() {
            let percentage = TOTAL_NOTES > 0 ? Math.round((score / TOTAL_NOTES) * 100) : 0;
            if (percentage < 0) percentage = 0;
            if (percentage > 100) percentage = 100;
            scoreDisplay.textContent = `${score}分 (正確率 ${percentage}%)`;
        }

        function parseTimeToSeconds(timeInput) {
            if (typeof timeInput === 'number') return timeInput;
            if (typeof timeInput !== 'string') return 0;
            
            const parts = timeInput.split(':');
            if (parts.length === 3) {
                const minutes = parseInt(parts[0], 10) || 0;
                const seconds = parseInt(parts[1], 10) || 0;
                const milliseconds = parseInt(parts[2], 10) || 0;
                return minutes * 60 + seconds + milliseconds / 100;
            } else if (parts.length === 2) {
                const minutes = parseInt(parts[0], 10) || 0;
                const seconds = parseFloat(parts[1]) || 0;
                return minutes * 60 + seconds;
            }
            return parseFloat(timeInput) || 0;
        }

        const rawChart = JSON.parse(document.getElementById('chart-data').textContent);
        const chart = rawChart
            .map(note => ({
                ...note,
                time: parseTimeToSeconds(note.time),
                hit: false,
                missed: false
            }))
            .sort((a, b) => a.time - b.time);

        function formatTime(seconds) {
            if (isNaN(seconds) || seconds < 0) seconds = 0;
            const m = Math.floor(seconds / 60).toString().padStart(2, '0');
            const s = Math.floor(seconds % 60).toString().padStart(2, '0');
            const ms = Math.floor((seconds % 1) * 100).toString().padStart(2, '0');
            return `${m}:${s}:${ms}`;
        }

        function getCurrentPlaybackTime() {
            if (useYouTube) {
                if (ytPlayer && typeof ytPlayer.getCurrentTime === 'function') {
                    return ytPlayer.getCurrentTime();
                }
                return 0;
            } else {
                return localVideo.currentTime;
            }
        }

        function exportInputLogToTxt() {
            if (playerInputsLog.length === 0) return;

            let textContent = "遊戲按鍵紀錄\n==================\n";
            playerInputsLog.forEach((log, index) => {
                textContent += `${index + 1}. 時間: ${log.time}, 按鍵: ${log.key}\n`;
            });

            const blob = new Blob([textContent], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'player_inputs_log.txt';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        localVideo.addEventListener('ended', () => {
            if (gameStarted) {
                gameStarted = false;
                exportInputLogToTxt();
            }
        });

        function startPlayback() {
            if (useYouTube) {
                if (ytPlayer && typeof ytPlayer.playVideo === 'function') {
                    ytPlayer.playVideo();
                }
            } else {
                localVideo.play().catch(err => {
                    console.log("本機影片播放失敗，自動切換至 YouTube", err);
                    switchToYouTube();
                    if (ytPlayer) ytPlayer.playVideo();
                });
            }
        }

        localVideo.addEventListener('error', () => {
            console.log("偵測不到本機檔案，切換為 YouTube 播放。");
            switchToYouTube();
        });

        function switchToYouTube() {
            useYouTube = true;
            localVideo.style.display = 'none';
            document.getElementById('youtube-player').style.display = 'block';
            
            if (ytApiReady && !ytPlayer) {
                initYouTubePlayer();
            }
        }

        function initYouTubePlayer() {
            ytPlayer = new YT.Player('youtube-player', {
                height: '50',
                width: '900',
                videoId: '6luQN1eA3_8',
                playerVars: {
                    'playsinline': 1,
                    'controls': 1,
                    'enablejsapi': 1
                },
                events: {
                    'onReady': () => {
                        if (useYouTube) {
                            startBtn.disabled = false;
                            startBtn.textContent = "點擊開始遊戲";
                        }
                    },
                    'onStateChange': (event) => {
                        // YT.PlayerState.ENDED 代表播放結束 (數值為 0)
                        if (event.data === 0 && gameStarted) {
                            gameStarted = false;
                            exportInputLogToTxt();
                        }
                    }
                }
            });
        }

        window.onYouTubeIframeAPIReady = function() {
            ytApiReady = true;
            if (useYouTube) {
                initYouTubePlayer();
            }
        };

        localVideo.addEventListener('loadeddata', () => {
            if (!useYouTube) {
                startBtn.disabled = false;
                startBtn.textContent = "點擊開始遊戲";
            }
        });

        setTimeout(() => {
            if (startBtn.disabled && !useYouTube) {
                startBtn.disabled = false;
                startBtn.textContent = "點擊開始遊戲";
            }
        }, 1500);

        startBtn.addEventListener('click', () => {
            if (startBtn.disabled) return;
            startScreen.style.display = 'none';
            startPlayback();
            gameStarted = true;
        });

        function drawNote(x, y, type) {
            ctx.save();
            ctx.translate(x, y);

            const radius = 40;
            let baseColor = '#ffffff';
            let glowColor = 'rgba(255, 255, 255, 0.6)';

            if (type === 'left') { baseColor = '#4a90e2'; glowColor = 'rgba(74, 144, 226, 0.6)'; }
            else if (type === 'right') { baseColor = '#e04a4a'; glowColor = 'rgba(224, 74, 74, 0.6)'; }
            else if (type === 'up') { baseColor = '#2ecc71'; glowColor = 'rgba(46, 204, 113, 0.6)'; }   // 上：清爽綠色
            else if (type === 'down') { baseColor = '#f1c40f'; glowColor = 'rgba(241, 196, 15, 0.6)'; } // 下：醒目黃色
            else if (type === 'space') { baseColor = '#ffffff'; glowColor = 'rgba(255, 255, 255, 0.8)'; }

            ctx.shadowColor = glowColor;
            ctx.shadowBlur = 12;

            if (type === 'space') {
                ctx.fillStyle = 'rgba(30, 30, 30, 0.85)';
            } else {
                ctx.fillStyle = 'rgba(0, 0, 0, 0)';
            }

            ctx.beginPath();
            ctx.arc(0, 0, radius, 0, Math.PI * 2);
            ctx.fill();

            ctx.lineWidth = 5;
            ctx.strokeStyle = baseColor;
            ctx.stroke();

            ctx.shadowBlur = 0;
            ctx.fillStyle = baseColor;

            if (type === 'space') {
                ctx.font = 'bold 35px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('S', 0, 0);
            } else {
                ctx.beginPath();
                ctx.lineWidth = 10;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';

                let angle = 0;
                if (type === 'left') angle = Math.PI;       
                if (type === 'right') angle = 0;            
                if (type === 'up') angle = -Math.PI / 2;    
                if (type === 'down') angle = Math.PI / 2;   

                ctx.rotate(angle);
                ctx.moveTo(-14, 0);
                ctx.lineTo(14, 0);
                ctx.moveTo(-3, -11);
                ctx.lineTo(14, 0);
                ctx.lineTo(-3, 11);
                ctx.stroke();
            }

            ctx.restore();
        }

        function updateGame() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (gameStarted) {
                const currentTime = getCurrentPlaybackTime();
                
                timeDisplay.textContent = formatTime(currentTime);

                if (Math.abs(currentTime - lastCurrentTime) > 0.5) {
                    chart.forEach(note => {
                        if (note.time >= currentTime - HIT_WINDOW) {
                            note.hit = false;
                            note.missed = false;
                        }
                    });
                }
                lastCurrentTime = currentTime;

                chart.forEach((noteData) => {
                    if (noteData.hit || noteData.missed) return;

                    const timeDiff = noteData.time - currentTime;

                    if (timeDiff < -HIT_WINDOW) {
                        noteData.missed = true;
                        score -= 0; 
                        updateScoreDisplay();
                        showFeedback("沒按到");
                        return;
                    }

                    if (timeDiff <= PREVIEW_TIME) {
                        const progress = 1 - (timeDiff / PREVIEW_TIME);
                        const currentX = SPAWN_X - (SPAWN_X - JUDGE_X) * progress;
                        const currentY = canvas.height / 2;

                        drawNote(currentX, currentY, noteData.type);
                    }
                });
            }
            requestAnimationFrame(updateGame);
        }

        requestAnimationFrame(updateGame);

        function triggerFlash(targetElement) {
            targetElement.classList.remove('flash');
            void targetElement.offsetWidth;
            targetElement.classList.add('flash');
        }

        function handleInput(pressedKey, element = judgeLine) {
            if (!gameStarted) return;

            triggerFlash(element);

            const currentTime = getCurrentPlaybackTime();

            // 記錄玩家按下的時間與按鍵內容
            playerInputsLog.push({
                time: formatTime(currentTime),
                key: pressedKey
            });

            let matchedNote = null;
            let earlyNoteExists = false;

            for (let i = 0; i < chart.length; i++) {
                const note = chart[i];
                if (!note.hit && !note.missed) {
                    const timeDiff = currentTime - note.time; 
                    
                    if (timeDiff < -HIT_WINDOW) {
                        earlyNoteExists = true;
                        break;
                    }

                    if (Math.abs(timeDiff) <= HIT_WINDOW) {
                        matchedNote = note;
                        break;
                    }

                    if (timeDiff > HIT_WINDOW) {
                        break; 
                    }
                }
            }

            if (matchedNote) {
                if (pressedKey === matchedNote.key) {
                    score += 1;
                    matchedNote.hit = true;
                    showFeedback("Good"); 
                } else {
                    score -= 0;
                    showFeedback("按錯啦"); 
                }
            } else if (earlyNoteExists) {
                score -= 0;
                showFeedback("太快了");
            } else {
                score -= 0;
                showFeedback("幹嘛亂按？");
            }
            
            updateScoreDisplay();
        }

        window.addEventListener('keydown', (event) => {
            if (!gameStarted) return;

            if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].includes(event.key)) {
                event.preventDefault();
            }

            let pressedKey = event.code;
            if (event.key === ' ') pressedKey = 'Space';

            if (['Space', 'ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].includes(pressedKey)) {
                handleInput(pressedKey, judgeLine);
            }
        });

        updateScoreDisplay();
    </script>

</body>
</html>
