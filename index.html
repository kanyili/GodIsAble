    <style>

#fireworks-canvas {
    position: fixed;
    left: 0;
    top: 0;
    width: 100vw;
    height: 100vh;
    pointer-events: none;
    z-index: 100;
}


        body {
            background-color: #1a1a1a;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            margin: 0;
            padding: 0;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        #game-wrapper {
            width: 1200px;
            height: 1100px;
            position: relative;
            transform-origin: top center;
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #game-container {
            width: 1200px;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #dashboard {
            margin-bottom: 10px;
            width: 1200px;
            height: 160px;
            background-color: #333;
            border: 3px solid #555;
            border-radius: 12px;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            box-sizing: border-box;
            margin-left: auto;
            margin-right: auto;
        }

        #score-display {
            width: 900px;
            margin: 0 auto 8px auto;
            text-align: center;
            font-size: 28px;
            font-weight: bold;
            color: #ffcc00;
        }

        #lyrics-box {
            width: 900px;
            height: auto;
            max-height: none;
            margin: 0 auto 8px auto;
            background-color: rgba(0, 0, 0, 0.4);
            border: 2px solid #444;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 28px;
            color: #ddd;
            text-align: center;
            padding: 12px 15px;
            box-sizing: border-box;
            line-height: 1.4;
            white-space: pre-wrap;
            overflow: visible;
        }

        #player-wrapper {
            position: relative;
            width: 900px;
            margin: 0 auto;
        }

        #player-container {
            width: 900px;
            height: 54px;
            margin: 0 auto;
            border: 3px solid #444;
            border-radius: 12px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            overflow: hidden;
            position: relative;
            background-color: #000;
        }

        #local-audio {
            width: 100%;
            display: block;
        }

        #start-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 30;
        }

        #start-btn {
            padding: 10px 25px;
            font-size: 20px;
            font-weight: bold;
            background-color: #ffcc00;
            color: #1a1a1a;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(255, 204, 0, 0.4);
            transition: transform 0.1s;
        }

        #start-btn:hover:not(:disabled) {
            transform: scale(1.05);
            background-color: #ffdd33;
        }

        #start-btn:disabled {
            background-color: #666;
            color: #aaa;
            cursor: not-allowed;
            box-shadow: none;
        }

        #time-display {
            position: absolute;
            left: 25px;
            font-size: 24px;
            font-weight: bold;
            color: #aaa;
            z-index: 10;
            font-family: monospace;
        }

        #feedback {
            position: absolute;
            left: 140px;
            width: 110px;
            font-size: 22px;
            font-weight: bold;
            color: #ff4444;
            text-align: center;
            z-index: 10;
            pointer-events: none;
        }

        #judge-line {
            position: absolute;
            left: 270px;
            width: 110px;
            height: 110px;
            background-color: rgba(255, 255, 255, 0.1);
            border: 4px solid #eee;
            border-radius: 50%;
            z-index: 10;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 50px;
            color: #fff;
            box-shadow: 0 0 15px rgba(255,255,255,0.3);
            transition: transform 0.1s;
            user-select: none;
        }

/* 答對：綠色 */
@keyframes flashCorrect {
    0% {
        transform: scale(1);
        border-color: #eee;
        background-color: rgba(255,255,255,0.1);
    }
    50% {
        transform: scale(1.15);
        border-color: #2ecc71;
        background-color: rgba(46,204,113,0.4);
        box-shadow: 0 0 25px #2ecc71;
    }
    100% {
        transform: scale(1);
        border-color: #eee;
        background-color: rgba(255,255,255,0.1);
    }
}

/* 答錯：紅色 */
@keyframes flashWrong {
    0% {
        transform: scale(1);
        border-color: #eee;
        background-color: rgba(255,255,255,0.1);
    }
    50% {
        transform: scale(1.15);
        border-color: #ff4444;
        background-color: rgba(255,68,68,0.4);
        box-shadow: 0 0 25px #ff4444;
    }
    100% {
        transform: scale(1);
        border-color: #eee;
        background-color: rgba(255,255,255,0.1);
    }
}

/* 太快：白色 */
@keyframes flashEarly {
    0%, 100% {
        transform: scale(1);
        border-color: #eee;
        background-color: rgba(255,255,255,0.1);
        box-shadow: 0 0 15px rgba(255,255,255,0.3);
    }
    50% {
        transform: scale(1.15);
        border-color: #eee;
        background-color: rgba(255,255,255,0.1);
        box-shadow: 0 0 15px rgba(255,255,255,0.3);
    }
}

.flash-correct {
    animation: flashCorrect 0.15s ease;
}

.flash-wrong {
    animation: flashWrong 0.15s ease;
}

.flash-early {
    animation: flashEarly 0.15s ease;
}


        #game-canvas {
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 5;
        }


#instructions {
            width: 900px;
            margin: 15px auto 0 auto;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            font-size: 16px;
            color: #ccc;
            text-align: left;
        }

        #instructions h4 {
            margin: 0;
            font-size: 16px;
            display: flex;
            align-items: center;
            gap: 5px;
            color: #fff;
        }

        #instructions ul {
            margin: 0;
            padding: 0;
            list-style: none;
            display: flex;
            gap: 20px;
        }

        #instructions li {
            display: flex;
            align-items: center;
            gap: 6px;
        }

    <script>
        function resizeGame() {
            const wrapper = document.getElementById('game-wrapper');
            const baseWidth = 1200;
            const baseHeight = 1100;

            const scaleX = window.innerWidth / baseWidth;
            const scaleY = window.innerHeight / baseHeight;
            const scale = Math.min(scaleX, scaleY);

            wrapper.style.transform = `scale(${scale})`;
        }

        window.addEventListener('resize', resizeGame);
        window.addEventListener('orientationchange', resizeGame);
        resizeGame();

        const localaudio = document.getElementById('local-audio');
        const startScreen = document.getElementById('start-screen');
        const startBtn = document.getElementById('start-btn');
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');

        const fireworksCanvas = document.getElementById('fireworks-canvas');
        const fireworksCtx = fireworksCanvas.getContext('2d');

function resizeFireworksCanvas() {
    fireworksCanvas.width = window.innerWidth;
    fireworksCanvas.height = window.innerHeight;
}

window.addEventListener('resize', resizeFireworksCanvas);
window.addEventListener('orientationchange', resizeFireworksCanvas);

resizeFireworksCanvas();

        const judgeLine = document.getElementById('judge-line');
        const scoreDisplay = document.getElementById('score-display');
        const timeDisplay = document.getElementById('time-display');
        const feedback = document.getElementById('feedback');
        
        const PREVIEW_TIME = 1.5; 
        const JUDGE_X = 325;      
        const SPAWN_X = 1150;     
        const HIT_WINDOW = 0.2;   

        let score = 0;
        let gameStarted = false;

// 記錄已經出現到哪一個 10%
let lastFireworkPercent = 0;

// 煙火粒子
let fireworks = [];

        let lastCurrentTime = 0;
        let feedbackTimer = null;
        let playerInputsLog = [];

        // 是否紀錄玩家按鍵
        // true  = 開啟紀錄
        // false = 暫停紀錄
        const RECORD_INPUTS = false;


        function showFeedback(text) {
            feedback.textContent = text;
            if (feedbackTimer) {
                clearTimeout(feedbackTimer);
            }
            feedbackTimer = setTimeout(() => {
                feedback.textContent = "";
            }, 1000);
        }

function updateScoreDisplay() {
    let percentage = TOTAL_NOTES > 0
        ? (score / TOTAL_NOTES) * 100
        : 0;

    percentage = Math.max(0, Math.min(100, percentage));

    scoreDisplay.textContent =
        `${score}分 (完成度 ${percentage.toFixed(1)}%)`;

    // 每增加 10% 就放一次煙火
    const fireworkPercent = Math.floor(percentage / 10) * 10;

    if (
        fireworkPercent >= 10 &&
        fireworkPercent > lastFireworkPercent
    ) {
        lastFireworkPercent = fireworkPercent;
        createFirework();
    }
}



function createFirework() {

    const rect = judgeLine.getBoundingClientRect();

    const centerX = rect.left + rect.width / 2;
    const centerY = rect.top + rect.height / 2;

    const x = centerX + (Math.random() - 0.5) * 100;
    const y = centerY + (Math.random() - 0.5) * 100;

    const colors = [
        '#ffcc00',
        '#ff4444',
        '#2ecc71',
        '#4a90e2',
        '#ffffff',
        '#ff66cc'
    ];

    for (let i = 0; i < 100; i++) {

        const angle = Math.random() * Math.PI * 2;
        const speed = 2 + Math.random() * 6;

        fireworks.push({
            x: x,
            y: y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            life: 1,
            color: colors[Math.floor(Math.random() * colors.length)]
        });
    }
}




function updateFireworks() {
    fireworksCtx.clearRect(
        0,
        0,
        fireworksCanvas.width,
        fireworksCanvas.height
    );

    fireworks.forEach(p => {
        p.x += p.vx;
        p.y += p.vy;

        p.vy += 0.05;

        // 空氣阻力
        p.vx *= 0.98;
        p.vy *= 0.98;

        p.life -= 0.015;

        fireworksCtx.globalAlpha = Math.max(0, p.life);
        fireworksCtx.fillStyle = p.color;

        fireworksCtx.beginPath();
        fireworksCtx.arc(p.x, p.y, 3, 0, Math.PI * 2);
        fireworksCtx.fill();
    });

    fireworksCtx.globalAlpha = 1;

    fireworks = fireworks.filter(p => p.life > 0);
}



const rawChart = JSON.parse(
    document.getElementById('chart-data').textContent
);

// 把遊戲畫面格式「MM:SS:百分之一秒」轉成秒數
function chartTimeToSeconds(timeString) {
    const parts = timeString.split(':');

    const minutes = parseInt(parts[0], 10);
    const seconds = parseInt(parts[1], 10);
    const hundredths = parseInt(parts[2], 10);

    return minutes * 60 + seconds + hundredths / 100;
}

const chart = rawChart
    .map(note => ({
        ...note,
        time: chartTimeToSeconds(note.time),
        hit: false,
        missed: false
    }))
    .sort((a, b) => a.time - b.time);

const TOTAL_NOTES = chart.length;

function formatTime(seconds) {

            if (isNaN(seconds) || seconds < 0) seconds = 0;
            const m = Math.floor(seconds / 60).toString().padStart(2, '0');
            const s = Math.floor(seconds % 60).toString().padStart(2, '0');
            const ms = Math.floor((seconds % 1) * 100).toString().padStart(2, '0');
            return `${m}:${s}:${ms}`;
        }

        function getCurrentPlaybackTime() {
            return localaudio.currentTime;
        }

function getNoteType(key) {
    switch (key) {
        case 'ArrowLeft':
            return 'left';

        case 'ArrowRight':
            return 'right';

        case 'ArrowUp':
            return 'up';

        case 'ArrowDown':
            return 'down';

        case 'Space':
            return 'space';

        default:
            return '';
    }
}


function exportInputLogToTxt() {
    if (playerInputsLog.length === 0) return;

    const chartData = playerInputsLog.map(log => ({
        time: log.time,
        key: log.key,
        type: getNoteType(log.key)
    }));

    // 每筆資料一行
    const textContent =
        '[\n' +
        chartData.map(note =>
            `    { "time": "${note.time}", "key": "${note.key}", "type": "${note.type}" }`
        ).join(',\n') +
        '\n]';

    const blob = new Blob(
        [textContent],
        { type: 'application/json;charset=utf-8' }
    );

    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');

    a.href = url;
    a.download = 'chart-data.json';

    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);

    URL.revokeObjectURL(url);
}



localaudio.addEventListener('ended', () => {
    if (gameStarted) {
        gameStarted = false;

        if (RECORD_INPUTS) {
            exportInputLogToTxt();
        }
    }
});


        function startPlayback() {
            localaudio.play().catch(err => {
                console.log("本機音/影片播放失敗", err);
            });
        }

        localaudio.addEventListener('error', () => {
            console.log("載入本機檔案發生錯誤。");
        });

        localaudio.addEventListener('canplaythrough', () => {
            startBtn.disabled = false;
            startBtn.textContent = "點擊開始遊戲";
        });

        startBtn.addEventListener('click', () => {
            if (startBtn.disabled) return;
            startScreen.style.display = 'none';
            startPlayback();
            gameStarted = true;
        });

        function drawNote(x, y, type) {
            ctx.save();
            ctx.translate(x, y);

            const radius = 40;
            let baseColor = '#ffffff';
            let glowColor = 'rgba(255, 255, 255, 0.6)';

            if (type === 'left') { baseColor = '#4a90e2'; glowColor = 'rgba(74, 144, 226, 0.6)'; }
            else if (type === 'right') { baseColor = '#e04a4a'; glowColor = 'rgba(224, 74, 74, 0.6)'; }
            else if (type === 'up') { baseColor = '#2ecc71'; glowColor = 'rgba(46, 204, 113, 0.6)'; }
            else if (type === 'down') { baseColor = '#f1c40f'; glowColor = 'rgba(241, 196, 15, 0.6)'; }
            else if (type === 'space') { baseColor = '#ffffff'; glowColor = 'rgba(255, 255, 255, 0.8)'; }

            ctx.shadowColor = glowColor;
            ctx.shadowBlur = 12;

            if (type === 'space') {
                ctx.fillStyle = 'rgba(30, 30, 30, 0.85)';
            } else {
                ctx.fillStyle = 'rgba(0, 0, 0, 0)';
            }

            ctx.beginPath();
            ctx.arc(0, 0, radius, 0, Math.PI * 2);
            ctx.fill();

            ctx.lineWidth = 5;
            ctx.strokeStyle = baseColor;
            ctx.stroke();

            ctx.shadowBlur = 0;
            ctx.fillStyle = baseColor;

            if (type === 'space') {
                ctx.font = 'bold 35px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('S', 0, 0);
            } else {
                ctx.beginPath();
                ctx.lineWidth = 10;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';

                let angle = 0;
                if (type === 'left') angle = Math.PI;       
                if (type === 'right') angle = 0;            
                if (type === 'up') angle = -Math.PI / 2;    
                if (type === 'down') angle = Math.PI / 2;   

                ctx.rotate(angle);
                ctx.moveTo(-14, 0);
                ctx.lineTo(14, 0);
                ctx.moveTo(-3, -11);
                ctx.lineTo(14, 0);
                ctx.lineTo(-3, 11);
                ctx.stroke();
            }

            ctx.restore();
        }

        function updateGame() {

ctx.clearRect(0, 0, canvas.width, canvas.height);

    // 更新煙火
    updateFireworks();

            if (gameStarted) {
                const currentTime = getCurrentPlaybackTime();
                
                timeDisplay.textContent = formatTime(currentTime);

                if (Math.abs(currentTime - lastCurrentTime) > 0.5) {
                    chart.forEach(note => {
                        if (note.time >= currentTime - HIT_WINDOW) {
                            note.hit = false;
                            note.missed = false;
                        }
                    });
                }
                lastCurrentTime = currentTime;

                chart.forEach((noteData) => {
                    if (noteData.hit || noteData.missed) return;

                    const timeDiff = noteData.time - currentTime;

                    if (timeDiff < -HIT_WINDOW) {
                        noteData.missed = true;
                        score -= 0; 
                        updateScoreDisplay();
                        showFeedback("沒按到");
                        return;
                    }

                    if (timeDiff <= PREVIEW_TIME) {
                        const progress = 1 - (timeDiff / PREVIEW_TIME);
                        const currentX = SPAWN_X - (SPAWN_X - JUDGE_X) * progress;
                        const currentY = canvas.height / 2;

                        drawNote(currentX, currentY, noteData.type);
                    }
                });
            }
            requestAnimationFrame(updateGame);
        }

        requestAnimationFrame(updateGame);

function triggerFlash(targetElement, type) {
    targetElement.classList.remove(
        'flash-correct',
        'flash-wrong',
        'flash-early'
    );

    void targetElement.offsetWidth;

    targetElement.classList.add(`flash-${type}`);
}


        function handleInput(pressedKey, element = judgeLine) {
    if (!gameStarted) return;

    const currentTime = getCurrentPlaybackTime();

    if (RECORD_INPUTS) {
        playerInputsLog.push({
            time: formatTime(currentTime),
            key: pressedKey
        });
    }

    let matchedNote = null;
    let earlyNoteExists = false;

    for (let i = 0; i < chart.length; i++) {
        const note = chart[i];

        if (!note.hit && !note.missed) {
            const timeDiff = currentTime - note.time;

            if (timeDiff < -HIT_WINDOW) {
                earlyNoteExists = true;
                break;
            }

            if (Math.abs(timeDiff) <= HIT_WINDOW) {
                matchedNote = note;
                break;
            }

            if (timeDiff > HIT_WINDOW) {
                break;
            }
        }
    }

    // =========================
    // 判斷結果 + 對應閃光顏色
    // =========================

    if (matchedNote) {

        // 答對 → 綠色
        if (pressedKey === matchedNote.key) {
            score += 1;
            matchedNote.hit = true;

            triggerFlash(element, 'correct');
            showFeedback("");

        // 答錯 → 紅色
        } else {
            triggerFlash(element, 'wrong');
            showFeedback("QQ");
        }

    // 太快 → 黃色
    } else if (earlyNoteExists) {

        triggerFlash(element, 'early');
        showFeedback("太快");

    // 沒有音符 → 紅色
    } else {

        triggerFlash(element, 'wrong');
        showFeedback("");
    }

    updateScoreDisplay();
}

        window.addEventListener('keydown', (event) => {
            if (!gameStarted) return;

            const allowedKeys = [
                'Space',
                'ArrowLeft',
                'ArrowRight',
                'ArrowUp',
                'ArrowDown'
            ];

            if (allowedKeys.includes(event.code)) {
                event.preventDefault();
                handleInput(event.code, judgeLine);
            }
        });

        updateScoreDisplay();
    </script>
